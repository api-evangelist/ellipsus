aid: ellipsus
name: Ellipsus
description: >-
  Ellipsus is a collaborative writing platform built for creative and fiction
  writers, combining a modern text editor with granular, Git-style version
  control so authors can draft, branch, share, and merge work together across
  devices. Founded in 2022 and operated by a small distributed team across
  Berlin (Germany), Madrid (Spain), and Szczecin (Poland), the product threads
  collaboration through every stage of writing — organizing drafts, discussing
  feedback, tracking changes, and preserving public version history — with a
  writers-first, artist-ownership, anti-AI-generated-content stance. Ellipsus
  offers a free tier and a paid Plus license, and is backed by Speedinvest.
  It is added to the API Evangelist network as a company profile; no public
  developer API surface was found during enrichment.
